<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" class="w-auto h-12">
  <!-- Window Arch Icon -->
  <g transform="translate(4, 6)">
    <!-- Outer Arch Frame -->
    <path d="M6 34 C6 15 16 4 34 4 C52 4 62 15 62 34 L62 62 C62 65 60 67 57 67 L11 67 C8 67 6 65 6 62 Z" 
          stroke="#0284c7" stroke-width="3" fill="#f0f9ff" />
    <!-- Window Outer Double Border -->
    <path d="M12 34 C12 19 20 10 34 10 C48 10 56 19 56 34 L56 61 L12 61 Z" 
          stroke="#0284c7" stroke-width="1.8" fill="#ffffff" />
    <!-- Center Vertical Mullion -->
    <line x1="34" y1="10" x2="34" y2="61" stroke="#0284c7" stroke-width="2.5" />
    <!-- Center Horizontal Rail -->
    <line x1="12" y1="36" x2="56" y2="36" stroke="#0284c7" stroke-width="2.5" />
    <!-- Sun and Horizon within panes -->
    <circle cx="34" cy="36" r="10" fill="#f26a36" fill-opacity="0.25" stroke="#f26a36" stroke-width="1.5" />
    <path d="M16 48 Q34 44 52 48" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M16 54 Q34 50 52 54" stroke="#0284c7" stroke-width="1.5" />
    <!-- Sill Base -->
    <rect x="2" y="66" width="64" height="4" rx="2" fill="#0284c7" />
  </g>
  
  <!-- Text Branding -->
  <g transform="translate(80, 18)">
    <!-- Main JJW Mark -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="28" font-weight="800" fill="#0284c7" letter-spacing="-0.03em">
      JJW
    </text>
    <!-- Secondary descriptor -->
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="12" font-weight="600" fill="#1e293b" letter-spacing="-0.01em">
      Window &amp; Door Installations
    </text>
  </g>
</svg>
